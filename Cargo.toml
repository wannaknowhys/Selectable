[package]
name = "selectable"
version = "0.1.0"
edition = "2021"
description = "Windows screenshot-to-selectable-text (PP-OCRv6 + ONNX Runtime, offline-first)"

[workspace]
members = [".", "xtask"]
default-members = ["."]

# NOTE: toolchain prerequisite is rustup + MSVC/Clang.
# ORT native binaries are fetched at build time by the `ort` crate, never vendored.
[dependencies]
ort = { version = "=2.0.0-rc.13", features = ["directml", "ndarray"] }
ndarray = "0.17"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_Networking_WinHttp",
  "Win32_Globalization",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
# Only the codecs we ship (PNG now, JPEG with the save-as todo).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"

[dev-dependencies]
ab_glyph = "0.2"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
