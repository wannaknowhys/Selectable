[package]
name = "selectable"
version = "0.1.0"
edition = "2021"
description = "Windows screenshot-to-selectable-text (PP-OCRv6 + ONNX Runtime, offline-first)"

# NOTE: toolchain prerequisite is rustup + MSVC/Clang.
# ORT native binaries are fetched at build time by the `ort` crate, never vendored.
[dependencies]
ort = { version = "=2.0.0-rc.13", features = ["directml", "ndarray"] }
ndarray = "0.17"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Ole",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
image = "0.25"
imageproc = "0.25"

[dev-dependencies]
ab_glyph = "0.2"
