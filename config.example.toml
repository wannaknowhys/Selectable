# Copy to config.toml and adjust. Real config.toml is gitignored.
[hotkey]
# v1: single combo. The code parses a list so options UI can add more later.
combos = ["Shift+PrintScreen"]

[ocr]
# Explicit tier wins or hard-errors when files are missing.
# When empty: cascade medium -> small -> tiny, first complete triple wins.
# model = "medium"
cascade = ["medium", "small", "tiny"]

[translate]
source = "bergamot"   # bergamot (offline) | external (always browser) | online (not wired yet)
external_url = "https://translate.google.com/?sl=auto&tl={tgt}&text={text}"
# Exit the fullscreen overlay after any external browser launch (search +
# translate fallbacks) so the just-opened browser is visible. false = stay.
external_auto_exit = true

[search]
# Preset name; explicit engine_url wins when uncommented.
# Presets (from Firefox search-config; partner codes stripped):
#   bing (default) | google | ddg (DuckDuckGo) | baidu | wikipedia (zh) | qwant
engine = "bing"
# engine_url = "https://www.bing.com/search?q={text}"

[save]
# Empty = Documents\ScreenShot. Set an absolute path to override.
# dir = "D:/Shots"
